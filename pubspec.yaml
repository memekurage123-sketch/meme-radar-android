name: meme_radar_android
description: Standalone Meme Radar Android core and application.
version: 1.1.9+14
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
